<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Stok & Barkod</title>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #2563eb;
            --accent: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            padding: 16px;
            padding-bottom: 30px;
        }

        .header {
            text-align: center;
            padding: 10px 0 20px 0;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-accent { background-color: var(--accent); }
        .btn-danger { background-color: var(--danger); width: 100%; margin-top: 10px; }
        .btn-excel-in { background-color: #059669; }
        .btn-excel-out { background-color: #0284c7; }

        .search-input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info .title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .product-info .details {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--success);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="header">
            <i class="fa-solid fa-store"></i> Market Stok Takip
        </div>

        <!-- ÜST BUTONLAR & ARAMA -->
        <div class="card">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="kameraAc()">
                    <i class="fa-solid fa-camera"></i> Kamerayı Aç
                </button>
                <button class="btn btn-accent" onclick="kameraAc()">
                    <i class="fa-solid fa-barcode"></i> Barkod Okut
                </button>
            </div>
            <input type="text" id="urunAra" class="search-input" placeholder="Ürün adı veya barkod ara..." onkeyup="urunAramaYap()">
        </div>

        <!-- KAMERA TARAMA ALANI -->
        <div id="cameraContainer" class="card hidden">
            <div id="reader" style="width: 100%;"></div>
            <button class="btn btn-danger" onclick="kameraKapat()">Kamerayı Kapat</button>
        </div>

        <!-- ÜRÜN LİSTESİ -->
        <div class="section-title">Ürün Listesi</div>
        <div id="urunListesi">
            <div class="product-item">
                <div class="product-info">
                    <div class="title">Örnek Ürün</div>
                    <div class="details">Barkod: 8690000000 | Stok: 15 Adet</div>
                </div>
                <div class="product-price">25.00 ₺</div>
            </div>
        </div>

        <!-- EXCEL İŞLEMLERİ -->
        <div class="card" style="margin-top: 20px;">
            <div class="section-title">Excel İşlemleri</div>
            <div class="btn-group" style="margin-bottom: 0;">
                <label class="btn btn-excel-in" style="margin: 0;">
                    <i class="fa-solid fa-file-import"></i> Yükle (Import)
                    <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" onchange="excelYukle(event)" hidden>
                </label>
                <button class="btn btn-excel-out" onclick="excelIndir()">
                    <i class="fa-solid fa-file-export"></i> İndir (Export)
                </button>
            </div>
        </div>
    </div>

    <!-- CDN Kütüphaneleri ve JS Bağlantıları -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.2.1/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    <script src="src/js/storage.js"></script>
    <script src="src/js/scanner.js"></script>
    <script src="src/js/excel.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
